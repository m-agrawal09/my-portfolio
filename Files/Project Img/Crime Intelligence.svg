<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.02" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />

  <!-- Top App Navigation Bar -->
  <rect x="0" y="0" width="800" height="48" fill="#090d16" />
  <circle cx="24" cy="24" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="40" cy="24" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="56" cy="24" r="5" fill="#10b981" opacity="0.8" />
  
  <text x="80" y="29" fill="#e2e8f0" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">KARNATAKA STATE POLICE — CRIME INTELLIGENCE &amp; FORECASTING</text>
  
  <!-- Bilingual indicator & Status badge -->
  <rect x="610" y="14" width="70" height="22" rx="11" fill="#1e293b" />
  <text x="625" y="29" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" font-weight="600">KN / EN</text>

  <rect x="690" y="14" width="94" height="22" rx="11" fill="#312e81" stroke="#6366f1" stroke-width="1" />
  <text x="702" y="29" fill="#a5b4fc" font-family="'Inter', sans-serif" font-size="10" font-weight="700">TOP 30 KSP</text>

  <!-- Left Sidebar / Metrics Column -->
  <rect x="18" y="62" width="220" height="82" rx="10" fill="#131c2e" stroke="#1e293b" stroke-width="1" />
  <text x="32" y="85" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="500">Total Analyzed Incidents</text>
  <text x="32" y="122" fill="#ffffff" font-family="'Inter', sans-serif" font-size="26" font-weight="800">128,490</text>
  <text x="146" y="121" fill="#10b981" font-family="'Inter', sans-serif" font-size="12" font-weight="600">↓ 14.2%</text>

  <rect x="18" y="154" width="220" height="82" rx="10" fill="#131c2e" stroke="#1e293b" stroke-width="1" />
  <text x="32" y="177" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="500">AI Clearance Prediction</text>
  <text x="32" y="214" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="26" font-weight="800">89.4%</text>
  <text x="146" y="213" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="12" font-weight="600">High Conf.</text>

  <rect x="18" y="246" width="220" height="82" rx="10" fill="#131c2e" stroke="#1e293b" stroke-width="1" />
  <text x="32" y="269" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="500">Hotspot Patrol Coverage</text>
  <text x="32" y="306" fill="#a855f7" font-family="'Inter', sans-serif" font-size="26" font-weight="800">94.8%</text>
  <text x="146" y="305" fill="#a855f7" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Optimal</text>

  <rect x="18" y="338" width="220" height="96" rx="10" fill="#131c2e" stroke="#1e293b" stroke-width="1" />
  <text x="32" y="360" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Tech Stack Architecture</text>
  <rect x="32" y="374" width="46" height="20" rx="4" fill="#1e293b" />
  <text x="40" y="388" fill="#60a5fa" font-family="'Inter', sans-serif" font-size="10" font-weight="600">React</text>
  <rect x="84" y="374" width="76" height="20" rx="4" fill="#1e293b" />
  <text x="90" y="388" fill="#f472b6" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Zoho Catalyst</text>
  <rect x="166" y="374" width="60" height="20" rx="4" fill="#1e293b" />
  <text x="174" y="388" fill="#34d399" font-family="'Inter', sans-serif" font-size="10" font-weight="600">AI / ML</text>
  <text x="32" y="418" fill="#64748b" font-family="'Inter', sans-serif" font-size="10">Geospatial Intelligence • Bilingual</text>

  <!-- Central Map / Geospatial Area -->
  <rect x="250" y="62" width="320" height="372" rx="12" fill="#131c2e" stroke="#1e293b" stroke-width="1" />
  <text x="268" y="88" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Geospatial Crime Hotspots (Karnataka)</text>
  <text x="268" y="104" fill="#64748b" font-family="'Inter', sans-serif" font-size="10">Bengaluru • Mysuru • Mangaluru • Hubballi</text>

  <!-- Map Grid Lines -->
  <path d="M 265 130 L 555 130 M 265 180 L 555 180 M 265 230 L 555 230 M 265 280 L 555 280 M 265 330 L 555 330 M 265 380 L 555 380" stroke="#1e293b" stroke-dasharray="3,3" stroke-width="1" />
  <path d="M 310 115 L 310 415 M 370 115 L 370 415 M 430 115 L 430 415 M 490 115 L 490 415" stroke="#1e293b" stroke-dasharray="3,3" stroke-width="1" />

  <!-- Stylized State Boundary & Heatmap Nodes -->
  <polygon points="340,140 430,135 480,180 500,240 470,320 440,390 380,410 320,380 300,320 330,240 320,180" fill="#0f172a" stroke="#334155" stroke-width="2" />

  <!-- Heatmap Glow Circles -->
  <circle cx="440" cy="340" r="38" fill="#ef4444" opacity="0.35" filter="url(#glow)" />
  <circle cx="440" cy="340" r="18" fill="#f59e0b" opacity="0.6" />
  <circle cx="440" cy="340" r="6" fill="#ffffff" />
  <text x="452" y="344" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="10" font-weight="700">Bengaluru Core</text>

  <circle cx="350" cy="310" r="26" fill="#8b5cf6" opacity="0.4" filter="url(#glow)" />
  <circle cx="350" cy="310" r="10" fill="#a855f7" opacity="0.7" />
  <circle cx="350" cy="310" r="4" fill="#ffffff" />

  <circle cx="400" cy="220" r="28" fill="#38bdf8" opacity="0.35" filter="url(#glow)" />
  <circle cx="400" cy="220" r="10" fill="#38bdf8" opacity="0.7" />
  <circle cx="400" cy="220" r="4" fill="#ffffff" />

  <circle cx="420" cy="165" r="22" fill="#ec4899" opacity="0.3" filter="url(#glow)" />
  <circle cx="420" cy="165" r="8" fill="#ec4899" opacity="0.6" />
  <circle cx="420" cy="165" r="3" fill="#ffffff" />

  <!-- Right Dashboard Widgets -->
  <!-- Predictive Forecasting Graph -->
  <rect x="582" y="62" width="202" height="178" rx="12" fill="#131c2e" stroke="#1e293b" stroke-width="1" />
  <text x="598" y="86" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="700">AI Crime Forecasting</text>
  <text x="598" y="100" fill="#64748b" font-family="'Inter', sans-serif" font-size="9">30-Day Trend Horizon</text>

  <!-- Trend Graph Path -->
  <path d="M 598 190 Q 630 170 655 145 T 700 130 T 740 100 T 770 85 L 770 215 L 598 215 Z" fill="url(#chartGrad)" />
  <path d="M 598 190 Q 630 170 655 145 T 700 130 T 740 100 T 770 85" fill="none" stroke="#38bdf8" stroke-width="2.5" />
  <circle cx="770" cy="85" r="4" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />

  <!-- Incident Categories Donut Chart & Breakdown -->
  <rect x="582" y="252" width="202" height="182" rx="12" fill="#131c2e" stroke="#1e293b" stroke-width="1" />
  <text x="598" y="274" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Incident Distribution</text>
  <text x="598" y="288" fill="#64748b" font-family="'Inter', sans-serif" font-size="9">Real-time Classification</text>

  <!-- Donut Rings -->
  <circle cx="640" cy="355" r="42" fill="none" stroke="#1e293b" stroke-width="16" />
  <circle cx="640" cy="355" r="42" fill="none" stroke="#8b5cf6" stroke-width="16" stroke-dasharray="140 264" stroke-dashoffset="0" />
  <circle cx="640" cy="355" r="42" fill="none" stroke="#38bdf8" stroke-width="16" stroke-dasharray="75 264" stroke-dashoffset="-140" />
  <circle cx="640" cy="355" r="42" fill="none" stroke="#ec4899" stroke-width="16" stroke-dasharray="45 264" stroke-dashoffset="-215" />
  
  <text x="640" y="358" text-anchor="middle" fill="#ffffff" font-family="'Inter', sans-serif" font-size="12" font-weight="800">AI</text>
  <text x="640" y="370" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="8">CLASS</text>

  <!-- Legend -->
  <rect x="698" y="315" width="8" height="8" rx="2" fill="#8b5cf6" />
  <text x="712" y="322" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="9">Property (53%)</text>

  <rect x="698" y="342" width="8" height="8" rx="2" fill="#38bdf8" />
  <text x="712" y="349" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="9">Traffic (28%)</text>

  <rect x="698" y="369" width="8" height="8" rx="2" fill="#ec4899" />
  <text x="712" y="376" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="9">Public (19%)</text>
</svg>
